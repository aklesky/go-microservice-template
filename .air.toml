root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd"
bin = "tmp/main"
include_ext = ["go"]
exclude_dir = ["tmp", "vendor"]
exclude_file = []
follow_symlink = true
delay = 1000
log = "stdout"
send_interrupt = true
kill_delay = "2s"
full_bin = "dlv exec ./tmp/main --listen=0.0.0.0:2345 --headless=true --api-version=2 --accept-multiclient --continue --log --"

[log]
level = "debug"

[misc]
clean_on_exit = true
